name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build static web app
        run: npm run build

      - name: Prepare Android WebView assets
        run: npm run build:android-assets

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Assemble Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload web build and Android APK
        uses: actions/upload-artifact@v4
        with:
          name: multi-hf-build
          if-no-files-found: error
          path: |
            dist/
            android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: multi-hf-build
          path: .

      - name: Create versioned release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          tag="v${version}"
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          apk_name="Multi-HF-v${version}-debug.apk"
          test -f "$apk_path"

          if release_json="$(curl --silent --show-error --fail \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null)"; then
            if jq -e --arg name "$apk_name" '.assets[]? | select(.name == $name)' <<<"$release_json" >/dev/null; then
              echo "Release $tag already includes $apk_name; nothing to upload."
              exit 0
            fi
          else
            payload="$(jq -nc --arg tag "$tag" --arg commit "$GITHUB_SHA" --arg name "Multi-HF $tag" \
              '{tag_name:$tag,name:$name,target_commitish:$commit,draft:false,prerelease:false,generate_release_notes:true}')"
            release_json="$(curl --silent --show-error --fail -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases")"
          fi

          release_id="$(jq -r '.id' <<<"$release_json")"
          curl --silent --show-error --fail -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$apk_path" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${apk_name}"
